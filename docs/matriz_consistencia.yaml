# Contenido de la matriz de consistencia. EDITAR AQUI y regenerar con:  python src/matriz_consistencia.py
# Alineada con el Anexo "Matriz de Consistencia" (Tabla A1) del Plan de tesis corregido: 8 problemas, 8 objetivos y 8 hipotesis
# especificos que se corresponden UNO A UNO (P1-OE1-H1 ... P8-OE8-H8) y la numeracion de las ablaciones E1 a E6 (Tabla 4.3).

titulo: "Matriz de consistencia"
proyecto: "Sistema de visión por computadora basado en Deep Learning para la clasificación comercial post-cosecha del limón sutil en las categorías Extra, Primera, Segunda, Tercera y Fábrica"
autores: "Angel Joel Alvarado Crisanto · Javier Fernandez Purizaca"
asesora: "Mtr. Ing. Maria Fernanda Tejada Begazo"
leyenda: "Fuente: Plan de tesis corregido (Tabla A1; hipótesis en la Tabla 3.6, variables en la Tabla 3.7 y ablaciones E1 a E6 en la Tabla 4.3). Los umbrales son provisionales hasta ratificarlos tras la prueba piloto."

general:
  problema: "¿Cuál es el desempeño de un sistema de visión por computadora basado en aprendizaje profundo para clasificar limón sutil en las categorías Extra, Primera, Segunda, Tercera y Fábrica, a partir de imágenes capturadas en condiciones controladas, en comparación con un estándar de referencia construido con mediciones físicas y consenso experto, y frente al desempeño de operarios evaluados contra ese mismo estándar?"
  objetivo: "Desarrollar y evaluar un sistema de visión por computadora basado en aprendizaje profundo que estime calibre, color y defectos del limón sutil a partir de imágenes multi-vista y asigne la categoría comercial (Extra, Primera, Segunda, Tercera o Fábrica) mediante una regla jerárquica, midiendo su desempeño frente a un estándar experto independiente y frente a operarios, en condiciones controladas y en centros de acopio de Olmos."
  hipotesis: "Un sistema multitarea por atributos (segmentación, calibre, color y defectos) con regla comercial final, entrenado con datos etiquetados por un estándar experto y particionados por fruto, lote y fecha, alcanza en la prueba interna un F1 macro igual o mayor que 0,90, un recall de Fábrica igual o mayor que 0,90 y un kappa igual o mayor que 0,80 frente al estándar experto; supera de forma estadísticamente significativa a un clasificador directo en F1 macro y presenta una concordancia con el estándar no inferior a la de operarios individuales."
  independientes:
    - "Arquitectura: clasificador directo; segmentación con clasificador aprendido; atributos con regla comercial; multitarea con cabezal de calibre (C0 a C3)"
    - "Uso de segmentación: con o sin segmentación explícita"
    - "Preprocesamiento: ninguno; corrección de brillo; corrección de brillo y color"
    - "Estrategia de balanceo: ninguna; pesos de clase; focal loss; aumento dirigido; combinación"
    - "Número de vistas por fruto: 1 vista ecuatorial (0°) frente a 5 vistas (0°, 90°, 180°, 270° y pedúnculo)"
    - "Condición de iluminación: controlada o con cambio moderado"
  dependientes:
    - "Categoría final: F1 macro, exactitud balanceada, recall por clase (en particular Fábrica), kappa"
    - "Calibre: MAE y RMSE en mm; error cerca de los límites"
    - "Segmentación y defectos: IoU, Dice, AP de máscara, sensibilidad por tipo de defecto"
    - "Rendimiento y estabilidad: latencia mediana y percentil 95; porcentaje de frutos que conservan categoría"
  intervinientes:
    - "Lote, fecha y prevalencia"
    - "Fiabilidad del panel (kappa inter-evaluador y repetibilidad)"
    - "Tiempo entre cosecha y captura"
    - "Operarios (experiencia y turno; tiempo por fruto)"
  indicadores:
    - "F1 macro ≥ 0,90"
    - "Recall de Fábrica ≥ 0,90"
    - "Kappa ≥ 0,80 frente al estándar experto (prueba interna)"
    - "F1 macro significativamente mayor que el del clasificador directo"
    - "Kappa no inferior al de operarios individuales"

especificos:
  - id: "1"
    problema: "P1. ¿Qué acuerdo inter-evaluador (kappa de Fleiss) e intra-evaluador alcanza un panel de agrónomos al etiquetar color y defectos, y qué reglas de desempate permiten fijar una categoría de referencia auditable?"
    objetivo: "OE1. Validar la fiabilidad y repetibilidad del protocolo de referencia comercial, determinando el acuerdo inter- e intra-evaluador de un panel de agrónomos sobre la muestra piloto."
    hipotesis: "H1. El panel de etiquetado es lo bastante fiable como para constituir el estándar experto."
    independientes: ["Protocolo de etiquetado: rúbrica, panel de agrónomos y regla de desempate"]
    dependientes: ["Fiabilidad del panel de etiquetado (interviniente en la Tabla 3.7)"]
    intervinientes: []
    indicadores:
      - "κ de Fleiss ≥ 0,75 y repetibilidad intra-evaluador ≥ 0,80 en la prueba piloto"
      - "Análisis: coeficientes de Cohen, Fleiss y AC1 de Gwet"

  - id: "2"
    problema: "P2. ¿Qué error, en milímetros, tiene el calibre ecuatorial estimado por segmentación calibrada frente a la medición con calibrador, en general y cerca de los límites entre categorías?"
    objetivo: "OE2. Determinar la precisión métrica en la estimación del calibre ecuatorial mediante segmentación calibrada frente al calibrador físico en rangos generales y en fronteras críticas."
    hipotesis: "H2. La estimación de calibre por segmentación calibrada es lo bastante exacta para separar categorías."
    independientes: ["Método de estimación del calibre: segmentación calibrada con escala píxel-milímetro por sesión (cabezal de calibre en C3)"]
    dependientes: ["Calibre: MAE y RMSE en mm; error cerca de los límites"]
    intervinientes: []
    indicadores:
      - "MAE ≤ 1,0 mm y RMSE ≤ 1,5 mm respecto a las mediciones con vernier"
      - "Error reportado en 34,5; 35; 36; 37; 38; 39 y 42 mm"
      - "Análisis: MAE, RMSE y gráfico de Bland–Altman"

  - id: "3"
    problema: "P3. ¿En qué medida capturar varias vistas por fruto reduce, frente a una sola vista, los defectos que pasan sin detectarse y que corresponden a Fábrica?"
    objetivo: "OE3. Evaluar el efecto de la captura multi-vista en la reducción de defectos no detectados, comparando una vista ecuatorial (0°) frente a la agregación de cinco vistas."
    hipotesis: "H3. Capturar cinco vistas reduce los defectos no detectados."
    independientes: ["Número de vistas por fruto: 1 vista ecuatorial (0°) frente a 5 vistas (E4)"]
    dependientes: ["Segmentación y defectos: proporción de frutos de Fábrica por defecto que pasan sin detectarse; sensibilidad por tipo de defecto"]
    intervinientes: []
    indicadores:
      - "Reducción ≥ 15 puntos porcentuales en la tasa de frutos de la categoría Fábrica omitidos"
      - "Análisis: prueba de McNemar para muestras pareadas, con intervalo de la diferencia (Ablación E4)"

  - id: "4"
    problema: "P4. ¿Cómo influyen la corrección de brillo y la normalización de color en la clasificación de color y madurez y en la separación de Primera y Segunda?"
    objetivo: "OE4. Determinar la influencia de la corrección de iluminación y la normalización colorimétrica en la clasificación de madurez en espacio CIELAB y en la separación del par Primera–Segunda."
    hipotesis: "H4. La corrección de brillo y la normalización de color mejoran la clasificación de color y la separación de Primera y Segunda."
    independientes: ["Preprocesamiento: ninguno; corrección de brillo; corrección de brillo y color (E1)"]
    dependientes: ["Categoría final: F1 de color/madurez y F1 del par Primera–Segunda"]
    intervinientes: []
    indicadores:
      - "+5 pp en F1 de color/madurez y +3 pp en F1 de Primera–Segunda respecto al modelo sin preprocesamiento"
      - "Análisis: bootstrap pareado y Wilcoxon entre semillas (Ablación E1)"

  - id: "5"
    problema: "P5. ¿Cuál es el aporte de la ponderación de clases, el focal loss y el aumento de datos en las categorías con menos ejemplos, Tercera y Fábrica?"
    objetivo: "OE5. Evaluar el impacto de las técnicas de balanceo de datos (ponderación, focal loss y data augmentation) en la sensibilidad y F1 de las clases minoritarias."
    hipotesis: "H5. Ponderación de clases, focal loss y aumento dirigido mejoran las clases minoritarias."
    independientes: ["Estrategia de balanceo: ninguna; pesos de clase; focal loss; aumento dirigido; combinación (E3)"]
    dependientes: ["Categoría final: F1 y sensibilidad por clase, en particular Tercera y Fábrica"]
    intervinientes: []
    indicadores:
      - "+8 pp en F1 de Tercera y Fábrica respecto al modelo sin balanceo; aporte de cada nivel reportado"
      - "Análisis: pareado y prueba de Wilcoxon (Ablación E3)"

  - id: "6"
    problema: "P6. ¿Supera un sistema que estima atributos y aplica una regla comercial a un clasificador directo de cinco clases entrenado con los mismos datos?"
    objetivo: "OE6. Comparar el desempeño clasificatorio de la arquitectura desacoplada por atributos y regla jerárquica frente a un clasificador directo end-to-end."
    hipotesis: "H6. La arquitectura por atributos supera al clasificador directo."
    independientes: ["Arquitectura: clasificador directo; segmentación con clasificador aprendido; atributos con regla comercial; multitarea con cabezal de calibre (C0 a C3)", "Uso de segmentación: con o sin segmentación explícita"]
    dependientes: ["Categoría final: F1 macro y su explicabilidad"]
    intervinientes: []
    indicadores:
      - "F1 macro superior en ≥ 3 pp, con intervalo de confianza del 95 % (bootstrap pareado) que excluye el cero"
      - "Ablaciones E2 y E5"

  - id: "7"
    problema: "P7. ¿Su concordancia con el estándar experto es comparable a la de operarios individuales, medida con kappa, F1 macro y pruebas pareadas?"
    objetivo: "OE7. Evaluar la concordancia diagnóstica del sistema respecto al estándar experto en comparación con operarios clasificadores independientes en pruebas pareadas."
    hipotesis: "H7. La concordancia del sistema con el estándar experto no es inferior a la de operarios individuales."
    independientes: ["Evaluador: sistema frente a operarios individuales"]
    dependientes: ["Categoría final: concordancia con el estándar (kappa, F1 macro)"]
    intervinientes: ["Operarios (experiencia y turno; tiempo por fruto)"]
    indicadores:
      - "Margen de no inferioridad: κ(sistema) − κ(operario) ≥ −0,05 (límite inferior del IC al 95 %)"
      - "Al menos 3 operarios; prueba de McNemar con corrección de Holm"

  - id: "8"
    problema: "P8. ¿Qué latencia por fruto y qué estabilidad ante pequeñas perturbaciones de captura presenta el sistema en condiciones de laboratorio?"
    objetivo: "OE8. Determinar la factibilidad computacional y la estabilidad operativa del sistema en laboratorio, midiendo latencia por fruto y robustez ante variaciones moderadas de luz."
    hipotesis: "H8. El sistema es computacionalmente factible y estable en laboratorio."
    independientes: ["Condición de iluminación: controlada o con cambio moderado (E6)"]
    dependientes: ["Rendimiento y estabilidad: latencia mediana y percentil 95; porcentaje de frutos que conservan categoría"]
    intervinientes: []
    indicadores:
      - "Latencia mediana ≤ 200 ms por fruto en GPU (cinco vistas integradas)"
      - "Consistencia diagnóstica ≥ 95 % ante perturbaciones lumínicas leves (Ablación E6)"
      - "Análisis: mediana y percentil 95; porcentaje de coincidencia"

observaciones:
  - "Alineación resuelta: en el Plan corregido, P1–P8, OE1–OE8 y H1–H8 se corresponden uno a uno y cada hipótesis tiene su ablación (H3→E4, H4→E1, H5→E3, H6→E2 y E5, H8→E6). Esta matriz sigue esa numeración; la versión anterior del repositorio usaba otra (OE5 agrupaba las ablaciones y OE2–OE4 eran de diseño)."
  - "Umbrales de la hipótesis general: la sección 4.6.4 ya fija cómo contrastarlos (IC95 % por bootstrap pareado con B = 1000 sobre la prueba congelada; el límite inferior debe cumplir el umbral). El repositorio lo implementa en src/estadistica.py (bootstrap_pareado y verifica_umbral_ic)."
  - "Estratificación de la partición (4.3 y 4.4): la tesis pide estratificar por categoría, lote y fecha. El repositorio estratifica por categoría × lote, y la fecha no interviene; además, en los datos actuales cada categoría proviene de una sola sesión (lote × fecha), lo que contradice la condición de 4.3 de que ningún lote ni fecha concentre la mayoría de una categoría. Con ese diseño la sesión predice la categoría y las métricas pueden estar infladas (ver Baseline_basico §0)."
  - "Escala píxel-milímetro: sin data/raw/calibracion_sesiones.csv el calibre en mm queda vacío y H2 no es medible. Los píxeles de distintas sesiones no son comparables (la escala varía entre 0,058 y 0,093 mm/px), así que diam_ecu_px también arrastra información de sesión."
  - "Tabla 1.1: sus intervalos literales dejan huecos (36–37 mm y 38–39 mm) y no tienen techo; la regla del repositorio usa cortes continuos en 35, 37 y 39 mm (propuesta de la sección 4.5.2) que el panel y el centro de acopio deben validar. Hoy hay frutos medidos dentro de esos huecos."
  - "Fábrica por defecto (H3): la tesis no fija el umbral de severidad del panel que define este subconjunto; el repositorio usa severidad ≥ 0,5 provisionalmente. Debe fijarse con la rúbrica (θ_def) antes de medir E4."
  - "Campos de datos exigidos y ausentes: fecha de cosecha, tiempo entre cosecha y captura (variable interviniente de la Tabla 3.7), productor y tipo de defecto (necesario para la sensibilidad por tipo). Tampoco hay panel_evaluaciones.csv, por lo que H1 no se puede calcular."
  - "Tamaño de muestra: hay 511 frutos con 5 vistas (≈100 por categoría) frente a los ≥ 1 500 y las cuotas 250/250/250/200/200 de la Tabla 4.1; el valor actual es el de un piloto ampliado, no el de la recolección definitiva."
  - "Búsqueda de hiperparámetros (Tabla 4.2): se implementa con presupuesto fijo por modelo para los clasificadores clásicos y se deja fijado, sin ejecutar, el espacio del modelo profundo (AdamW, coseno, early stopping, focal loss γ/α, λ multitarea)."
  - "Umbrales provisionales: la Tabla 3.6 los declara provisionales hasta ratificarlos tras el piloto; la matriz debe actualizarse con los valores definitivos, incluidos θ_def y θ_col."

