  - ["H1", "Kappa de Fleiss/Cohen, AC1 y repetibilidad a partir de panel_evaluaciones.csv", "Formato definido en docs/diccionario_datos.md; falta el script de consolidación y cálculo", "Pendiente"]
  - ["H2", "MAE/RMSE del calibre extraído frente al calibrador", "Validación de la extracción (notebook y informe) con features clásicas; falta Bland–Altman, error por rango (34,5–42 mm) y el calibre del modelo profundo", "Parcial"]
  - ["H3", "Una vista frente a cinco vistas", "Variante V1 del baseline (F1 con modelos clásicos); falta la métrica de defectos no detectados y McNemar", "Parcial"]
  - ["H4", "Con / sin corrección de brillo y color", "Requiere la corrección con la carta de color (src/preprocesamiento.py es un esqueleto)", "Pendiente"]
  - ["H5", "Balanceo de clases", "Variante V2 (sobremuestreo y submuestreo aleatorios); faltan pesos de clase, focal loss y aumento dirigido (modelo profundo)", "Parcial"]
  - ["H6", "Atributos con regla comercial frente a clasificador directo", "Arquitecturas definidas (modelo_mvcnn.py, modelo_multitarea.py) sin entrenar; importancia de variables por dimensión como apoyo; prueba t corregida con Holm disponible, falta el bootstrap pareado", "Pendiente"]
  - ["H7", "Sistema frente a operarios", "Requiere evaluaciones de operarios (datos); sin código", "Pendiente"]
  - ["H8", "Latencia y estabilidad ante perturbaciones", "Latencia de extracción de features medida en el informe; falta la latencia del modelo profundo y de la API en GPU, y E6", "Parcial"]
  - ["Hipótesis general", "F1 macro ≥ 0,90, recall de Fábrica ≥ 0,90 y kappa ≥ 0,80 en la prueba interna", "Requiere el modelo profundo y las categorías completas; el TEST se evalúa una sola vez", "Pendiente"]
