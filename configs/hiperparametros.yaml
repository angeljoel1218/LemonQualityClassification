# Busqueda ACOTADA de hiperparametros con PRESUPUESTO FIJO por modelo (plan de tesis, Tabla 4.2 y seccion 4.6.1).
# Protocolo (identico al del baseline, para que las comparaciones sean pareadas):
#   * misma particion congelada y mismos pliegues/semillas que baseline.yaml y fe.yaml
#   * la busqueda y la seleccion usan SOLO train (CV estratificada); VAL se reporta como control; TEST no se toca
#   * el mismo numero de candidatos por modelo (presupuesto de computo fijo) -> ningun modelo gana por mas intentos
semillas: [0, 1, 2]
cv_folds: 5
positivo: Fabrica
metrica_seleccion: f1_macro       # el mejor candidato de cada modelo se elige por esta metrica en CV
conjunto_features: A              # A = originales (comparable con el baseline); tambien se admite A+C
presupuesto_por_modelo: 24        # candidatos por modelo (muestreo aleatorio sin reemplazo del espacio de abajo)
semilla_muestreo: 0
alfa: 0.05                        # umbral tras la correccion de Holm al comparar contra el baseline

# Niveles de balanceo en el ORDEN de la Tabla 3.4 de la tesis (prioridad 2: ponderacion de clases o muestreo balanceado).
# "pesos" solo aplica a modelos que aceptan class_weight (logreg, rf). Focal loss y aumento dirigido (prioridad 3 y 4)
# requieren el modelo profundo: ver `espacio_profundo` mas abajo.
balanceo: [ninguno, pesos, sobre, sub]

modelos: [knn, logreg, rf, gnb]

espacio:
  knn:
    n_neighbors: [1, 3, 5, 7, 9, 11, 15, 21, 31]
    weights: [uniform, distance]
    p: [1, 2]
  logreg:
    C: {tipo: log, min: 0.001, max: 100.0}
  rf:
    n_estimators: [100, 200]
    max_depth: [3, 5, 8, 12, null]
    min_samples_leaf: [1, 2, 4, 8]
    max_features: [sqrt, log2, 0.5]
  gnb:
    var_smoothing: {tipo: log, min: 1.0e-12, max: 1.0e-2}

# Calibracion de los umbrales de la regla comercial (tesis 4.6.1 A.4): se ajustan sobre VALIDACION.
umbrales_regla:
  theta_def: {min: 0.00, max: 0.30, paso: 0.01}       # fraccion de superficie con defecto
  theta_col: {min: 80.0, max: 130.0, paso: 2.5}       # matiz CIELAB (grados) por debajo del cual el fruto es amarillo
  recall_fabrica_minimo: 0.90                         # umbral de la hipotesis general (recall de Fabrica >= 0,90)

# ----------------------------------------------------------------------------------------------------------------
# Espacio de busqueda del modelo PROFUNDO (E2_mvcnn y E5_multitarea). NO se ejecuta en este repositorio (requiere GPU
# y las imagenes); queda fijado aqui, antes de entrenar, para que la busqueda tenga el mismo presupuesto por configuracion.
# Entrenamiento de la tesis (4.6.1 A.3): AdamW, decaimiento de la tasa de aprendizaje por coseno, early stopping sobre
# la perdida de validacion.
espacio_profundo:
  presupuesto_por_configuracion: 12
  optimizador: adamw
  scheduler: cosine
  early_stopping: {monitor: val_loss, paciencia: [5, 8]}
  lr: {tipo: log, min: 1.0e-5, max: 1.0e-3}
  weight_decay: {tipo: log, min: 1.0e-5, max: 1.0e-1}
  batch_size: [8, 16]
  focal_loss: {gamma: [0.0, 1.0, 2.0, 3.0], alpha: [0.25, 0.5, 0.75]}       # gamma = 0 equivale a entropia cruzada (Tabla 3.4, prioridad 3)
  pooling_vistas: [max, mean]                                               # solo E2_mvcnn
  lambdas_multitarea: {lambda_seg: [0.5, 1.0], lambda_col: [0.5, 1.0], lambda_reg: [0.5, 1.0, 2.0]}   # ecuacion (3)
  aumento: [ninguno, geometrico, geometrico_color_suave]                     # Tabla 3.4, prioridad 4
