[tool.poetry]
name = "tesis-limon-uni"
version = "0.1.0"
description = "Clasificacion comercial post-cosecha de limon con vision por computadora"
authors = ["Angel Joel Alvarado Crisanto", "Javier Fernandez Purizaca"]

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.1"
torchvision = ">=0.16"
opencv-python = ">=4.9"
numpy = ">=1.26"
pandas = ">=2.2"
scikit-learn = ">=1.5"
scikit-image = ">=0.22"
albumentations = ">=1.4"
pyyaml = ">=6.0"
matplotlib = ">=3.8"
mlflow = ">=2.10"
jupyter = ">=1.0"
scipy = ">=1.11"
python-docx = ">=1.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
